<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Neobrutalist drop shadow -->
  <rect x="8" y="8" width="52" height="52" fill="#111111" rx="0" />
  <!-- Neobrutalist main card in signature yellow -->
  <rect x="4" y="4" width="52" height="52" fill="#ffd93d" stroke="#111111" stroke-width="4" rx="0" />
  <!-- Bold TR Monogram -->
  <text x="30" y="40" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#111111" text-anchor="middle" letter-spacing="-1">TR</text>
</svg>
